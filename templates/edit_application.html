
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

    <h1>Edit Application</h1>

    <a href="{{ url_for('applications') }}">Back to Applications</a>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form
        action="{{ url_for('edit_application', application_id=application.application_id) }}"
        method="POST"
    >

        <label for="job_id">Job:</label>
        <select name="job_id" id="job_id" required>
            {% for job in jobs %}
                <option
                    value="{{ job.job_id }}"
                    {% if job.job_id == application.job_id %}selected{% endif %}
                >
                    {{ job.company_name or 'No Company' }}
                    - {{ job.job_title }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="application_date">Application Date:</label>
        <input
            type="date"
            name="application_date"
            id="application_date"
            value="{{ application.application_date.isoformat() if application.application_date else '' }}"
        >

        <br><br>

        <label for="status">Status:</label>
        <select name="status" id="status">
            <option value="">Select Status</option>

            {% for status in ['Applied', 'Screening', 'Interview', 'Offer', 'Rejected', 'Withdrawn'] %}
                <option
                    value="{{ status }}"
                    {% if application.status == status %}selected{% endif %}
                >
                    {{ status }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="resume_version">Resume Version:</label>
        <input
            type="text"
            name="resume_version"
            id="resume_version"
            maxlength="50"
            value="{{ application.resume_version or '' }}"
        >

        <br><br>

        <label for="cover_letter_sent">Cover Letter Sent:</label>
        <select name="cover_letter_sent" id="cover_letter_sent">
            <option
                value="0"
                {% if not application.cover_letter_sent %}selected{% endif %}
            >
                No
            </option>

            <option
                value="1"
                {% if application.cover_letter_sent %}selected{% endif %}
            >
                Yes
            </option>
        </select>

        <br><br>

        <label for="interview_data">Interview Notes:</label>
        <textarea
            name="interview_data"
            id="interview_data"
            rows="5"
            cols="45"
        >{{ application.interview_data or '' }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>
        <a href="{{ url_for('applications') }}">Cancel</a>

    </form>

</body>
</html>
